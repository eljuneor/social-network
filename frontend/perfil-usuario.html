<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" href="perfil-usuario.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-placeholder">LOGO</div>
                <div class="search-wrap">
                    <input type="text" id="busqueda" placeholder="Buscar posts..." class="search">
                    <button class="btn-action" onclick="buscar()">Buscar</button>
                </div>
            </div>
            <div id="header-user"></div>
        </div>
    </header>

    <!-- PERFIL -->
    <section class="perfil">
        <div class="foto-perfil" id="avatar"></div>
        <h2 id="username">Cargando...</h2>
    </section>

    <!-- GALERÍA -->
    <section class="galeria" id="galeria"></section>

<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    // Header user
    const headerUser = document.getElementById('header-user');
    if (user) {
        headerUser.innerHTML = `
            <a href="perfil.html" class="avatar-btn" title="${user.username}">
                ${user.username.charAt(0).toUpperCase()}
            </a>
        `;
    } else {
        headerUser.innerHTML = `<a href="login.html" class="btn-action">Iniciar sesión</a>`;
    }

    // Obtener author_id desde la URL
    const params = new URLSearchParams(window.location.search);
    const authorId = params.get('id');

    async function cargarPerfil() {
        const galeria = document.getElementById('galeria');

        if (!authorId) {
            galeria.innerHTML = '<p style="color:#f87171; text-align:center;">Usuario no encontrado.</p>';
            return;
        }

        try {
            const res = await fetch('https://social-network-production-59ef.up.railway.app/api/posts');
            const posts = await res.json();

            const misPosts = posts.filter(p => p.author_id === authorId);

            if (misPosts.length === 0) {
                galeria.innerHTML = '<p style="color:#cbd5f5; text-align:center; padding:20px;">Este usuario no tiene publicaciones.</p>';
                return;
            }

            // Tomar datos del autor del primer post
            const autor = misPosts[0];
            document.getElementById('username').textContent = '@' + autor.author_username;
            document.getElementById('avatar').textContent = autor.author_username.charAt(0).toUpperCase();

            galeria.innerHTML = misPosts.map(post => `
                <div class="post-card" onclick="window.location.href='post-detalle.html?id=${post._id}'">
                    ${post.media_url
                        ? `<div class="img"><img src="${post.media_url}" alt="media"></div>`
                        : post.tags && post.tags.length > 0
                            ? `<div class="img tag-img">
                                ${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                               </div>`
                            : `<div class="img"></div>`
                    }
                    <div class="post-body">
                        <p class="post-content">${post.content}</p>
                        <div class="post-footer">
                            <span class="like-count">❤️ ${post.likes_count} likes</span>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (err) {
            galeria.innerHTML = '<p style="color:#f87171; text-align:center;">Error al cargar el perfil.</p>';
        }
    }

    function buscar() {
        const texto = document.getElementById('busqueda').value.trim();
        if (texto) {
            window.location.href = `posts.html?q=${encodeURIComponent(texto)}`;
        }
    }

    document.getElementById('busqueda').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscar();
    });

    cargarPerfil();
</script>

</body>
</html>
