<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
    <link rel="stylesheet" href="posts.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1 id="titulo">Resultados</h1>
        <div style="display:flex; gap:10px;">
            <button class="perfil" onclick="window.location.href='index.html'">← Volver</button>
            <button class="perfil" onclick="window.location.href='perfil.html'">Perfil</button>
        </div>
    </header>

    <!-- GRID DE POSTS -->
    <section class="grid" id="grid"></section>

<script>
    // Leer el parámetro de búsqueda de la URL
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') || '';

    if (query) {
        document.getElementById('titulo').textContent = `Resultados para: "${query}"`;
    }

    async function cargarPosts() {
        const grid = document.getElementById('grid');

        try {
            const res = await fetch('https://social-network-production-59ef.up.railway.app/api/posts');
            const posts = await res.json();

            if (!res.ok) {
                grid.innerHTML = '<p style="color:#f87171; padding:20px;">Error al cargar posts.</p>';
                return;
            }

            // Filtrar por el texto de búsqueda
            const filtrados = query
                ? posts.filter(post =>
                    post.content.toLowerCase().includes(query.toLowerCase()) ||
                    post.author_username.toLowerCase().includes(query.toLowerCase()) ||
                    (post.tags && post.tags.some(t => t.toLowerCase().includes(query.toLowerCase())))
                )
                : posts;

            if (filtrados.length === 0) {
                grid.innerHTML = `<p style="color:#cbd5f5; padding:20px;">No se encontraron posts para "${query}".</p>`;
                return;
            }

            grid.innerHTML = filtrados.map(post => `
                <div class="post">
                    ${post.media_url
                        ? `<div class="img"><img src="${post.media_url}" alt="media"></div>`
                        : post.tags && post.tags.length > 0
                            ? `<div class="img" style="display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; padding:8px;">
                                ${post.tags.map(t => `<span style="background:rgba(255,255,255,0.15); padding:3px 8px; border-radius:20px; font-size:12px;">#${t}</span>`).join('')}
                               </div>`
                            : ''
                    }
                    <p style="font-size:14px; margin:8px 0;">${post.content}</p>
                    <p style="font-size:12px; color:#94a3b8;">@${post.author_username}</p>
                    <p style="font-size:12px; color:#64748b;">❤️ ${post.likes_count} likes</p>
                </div>
            `).join('');

        } catch (err) {
            grid.innerHTML = '<p style="color:#f87171; padding:20px;">Error de conexión con el servidor.</p>';
        }
    }

    cargarPosts();
</script>

</body>
</html>
