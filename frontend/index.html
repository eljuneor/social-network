<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Posts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
<header class="header">
    <h1>Explorar Posts</h1>
    <div class="top-bar">
        <input type="text" id="busqueda" placeholder="Buscar posts..." class="search">
        <button class="btn-buscar" onclick="buscar()">Buscar</button>
        <a href="crear-post.html" class="perfil-btn">+ Crear Post</a>
        <a href="perfil.html" class="perfil-btn">Perfil</a>
        <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</header>

    <!-- GRID DE POSTS -->
    <section class="grid" id="grid"></section>

<script>
    async function cargarPosts() {
        const grid = document.getElementById('grid');

        try {
            const res = await fetch('https://social-network-production-59ef.up.railway.app/api/posts');
            const posts = await res.json();

            if (!res.ok || posts.length === 0) {
                grid.innerHTML = '<p style="color:#cbd5f5; padding: 20px;">No hay posts aún.</p>';
                return;
            }

            grid.innerHTML = posts.map(post => `
                <div class="post">
                    ${post.media_url
                        ? `<div class="img"><img src="${post.media_url}" alt="media" style="width:100%; height:100%; object-fit:cover; border-radius:10px;"></div>`
                        : post.tags && post.tags.length > 0
                            ? `<div class="img" style="display:flex; align-items:center; justify-content:center; font-size:13px; color:white; flex-wrap:wrap; gap:4px; padding:8px;">
                                ${post.tags.map(t => `<span style="background:rgba(255,255,255,0.15); padding:3px 8px; border-radius:20px;">#${t}</span>`).join('')}
                               </div>`
                            : ''
                    }
                    <p style="font-size:14px; margin: 8px 0;">${post.content}</p>
                    <p style="font-size:12px; color:#94a3b8;">@${post.author_username}</p>
                    <p style="font-size:12px; color:#64748b;">❤️ ${post.likes_count} likes</p>
                </div>
            `).join('');

        } catch (err) {
            grid.innerHTML = '<p style="color:#f87171; padding: 20px;">Error al cargar los posts.</p>';
        }
    }

    function buscar() {
        const texto = document.getElementById('busqueda').value.trim();
        if (texto) {
            window.location.href = `posts.html?q=${encodeURIComponent(texto)}`;
        }
    }

    document.getElementById('busqueda').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscar();
    });

    function cerrarSesion() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    cargarPosts();
</script>

</body>
</html>
