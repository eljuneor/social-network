<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Posts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <!-- LOGO -->
            <div class="logo">
                <img src="zlogo.png" alt="logo" class="logo-img">
                <h1>Explorar Posts</h1>
            </div>

            <!-- AVATAR O BOTÓN LOGIN -->
            <div class="header-user" id="header-user"></div>
        </div>

        <!-- BARRA DE BÚSQUEDA Y BOTONES -->
        <div class="header-actions">
            <div class="search-wrap">
                <input type="text" id="busqueda" placeholder="Buscar posts..." class="search">
                <button class="btn-action" onclick="buscar()">Buscar</button>
            </div>
            <a href="crear-post.html" class="btn-action">+ Crear Post</a>
        </div>
    </header>

    <!-- GRID DE POSTS -->
    <section class="grid" id="grid"></section>

<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    // Header user
    const headerUser = document.getElementById('header-user');
    if (user) {
    headerUser.innerHTML = `
        <span style="font-size:13px; color:#cbd5f5;">Bienvenido, @${user.username}</span>
        <a href="perfil.html" class="avatar-btn" title="${user.username}">
            ${user.username.charAt(0).toUpperCase()}
        </a>
    `;
    } else {
        headerUser.innerHTML = `<a href="login.html" class="btn-action">Iniciar sesión</a>`;
    }

   async function cargarPosts() {
    const grid = document.getElementById('grid');

    try {
        // Traer posts y likes del usuario al mismo tiempo
        const [resPosts, resLikes] = await Promise.all([
            fetch('https://social-network-production-8a9a.up.railway.app/api/posts'),
            token
                ? fetch('https://social-network-production-8a9a.up.railway.app/api/posts/mis-likes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                  })
                : Promise.resolve(null)
        ]);

        const posts = await resPosts.json();
        const misLikes = resLikes ? await resLikes.json() : [];

        if (!resPosts.ok || posts.length === 0) {
            grid.innerHTML = '<p style="color:#cbd5f5; padding:20px;">No hay posts aún.</p>';
            return;
        }

        grid.innerHTML = posts.map(post => {
            const yaLiked = misLikes.includes(post._id);
            return `
                <div class="post-card" onclick="window.location.href='post-detalle.html?id=${post._id}'">
                    ${post.media_url
                        ? `<div class="img"><img src="${post.media_url}" alt="media"></div>`
                        : post.tags && post.tags.length > 0
                            ? `<div class="img tag-img">
                                ${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                               </div>`
                            : ''
                    }
                    <div class="post-body">
                        <p class="post-content">${post.content}</p>
                        <p class="post-author">@${post.author_username}</p>
                        <div class="post-footer">
                            <button class="like-btn ${yaLiked ? 'liked' : ''}" onclick="toggleLike(event, '${post._id}', this)">
                                ❤️ <span class="like-count">${post.likes_count}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        grid.innerHTML = '<p style="color:#f87171; padding:20px;">Error al cargar los posts.</p>';
    }
}

    async function toggleLike(e, postId, btn) {
        e.stopPropagation();

        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const countEl = btn.querySelector('.like-count');
        const current = parseInt(countEl.textContent);
        const liked = btn.classList.contains('liked');

        try {
            const res = await fetch(`https://social-network-production-8a9a.up.railway.app/api/posts/${postId}/like`, {
                method: liked ? 'DELETE' : 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                btn.classList.toggle('liked');
                countEl.textContent = liked ? current - 1 : current + 1;
            }

        } catch (err) {
            console.error('Error al dar like:', err);
        }
    }

    function buscar() {
        const texto = document.getElementById('busqueda').value.trim();
        if (texto) {
            window.location.href = `posts.html?q=${encodeURIComponent(texto)}`;
        }
    }

    document.getElementById('busqueda').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscar();
    });

    cargarPosts();
</script>

</body>
</html>
