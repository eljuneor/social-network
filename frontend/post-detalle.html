<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="post-detalle.css">
</head>
<body>

    <header class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-placeholder">LOGO</div>
                <a href="index.html" class="back-link">← Volver</a>
            </div>
            <div id="header-user"></div>
        </div>
    </header>

    <main class="detalle-container" id="detalle">
        <p style="color:#cbd5f5; text-align:center; padding:40px;">Cargando post...</p>
    </main>

<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    // Header user
    const headerUser = document.getElementById('header-user');
    if (user) {
        headerUser.innerHTML = `
            <a href="perfil.html" class="avatar-btn" title="${user.username}">
                ${user.username.charAt(0).toUpperCase()}
            </a>
        `;
    } else {
        headerUser.innerHTML = `<a href="login.html" class="btn-action">Iniciar sesión</a>`;
    }

    // Obtener id del post desde la URL
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    async function cargarPost() {
        const detalle = document.getElementById('detalle');

        if (!postId) {
            detalle.innerHTML = '<p style="color:#f87171; text-align:center;">Post no encontrado.</p>';
            return;
        }

        try {
            const res = await fetch('https://social-network-production-59ef.up.railway.app/api/posts');
            const posts = await res.json();
            const post = posts.find(p => p._id === postId);

            if (!post) {
                detalle.innerHTML = '<p style="color:#f87171; text-align:center;">Post no encontrado.</p>';
                return;
            }

            const fecha = new Date(post.created_at).toLocaleDateString('es-MX', {
                year: 'numeric', month: 'long', day: 'numeric'
            });

            detalle.innerHTML = `
                <div class="post-full">
                    ${post.media_url
                        ? `<div class="media-wrap">
                            <img src="${post.media_url}" alt="media">
                           </div>`
                        : ''
                    }
                    <div class="post-info">
                        <div class="post-header">
                            <div class="autor-info">
                                <div class="autor-avatar">${post.author_username.charAt(0).toUpperCase()}</div>
                                <div>
                                    <p class="autor-nombre">@${post.author_username}</p>
                                    <p class="post-fecha">${fecha}</p>
                                </div>
                            </div>
                            <button class="btn-action" onclick="verPerfil('${post.author_id}')">
                                Ver perfil
                            </button>
                        </div>

                        <p class="post-content">${post.content}</p>

                        ${post.tags && post.tags.length > 0
                            ? `<div class="tags-wrap">
                                ${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                               </div>`
                            : ''
                        }

                        <div class="post-footer">
                            <button class="like-btn" id="like-btn" onclick="toggleLike('${post._id}')">
                                ❤️ <span id="like-count">${post.likes_count}</span> likes
                            </button>
                        </div>
                    </div>
                </div>
            `;

        } catch (err) {
            detalle.innerHTML = '<p style="color:#f87171; text-align:center;">Error al cargar el post.</p>';
        }
    }

    async function toggleLike(postId) {
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const btn = document.getElementById('like-btn');
        const countEl = document.getElementById('like-count');
        const current = parseInt(countEl.textContent);
        const liked = btn.classList.contains('liked');

        try {
            const res = await fetch(`https://social-network-production-59ef.up.railway.app/api/posts/${postId}/like`, {
                method: liked ? 'DELETE' : 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                btn.classList.toggle('liked');
                countEl.textContent = liked ? current - 1 : current + 1;
            }

        } catch (err) {
            console.error('Error al dar like:', err);
        }
    }

    function verPerfil(authorId) {
        // Próximamente — perfil de otro usuario
        window.location.href = `perfil-usuario.html?id=${authorId}`;
    }

    cargarPost();
</script>

</body>
</html>
