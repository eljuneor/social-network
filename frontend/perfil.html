<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <img src="zlogo.png" alt="logo" class="logo-img">
                <div class="search-wrap">
                    <input type="text" id="busqueda" placeholder="Buscar posts..." class="search">
                    <button class="btn-action" onclick="buscar()">Buscar</button>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <div id="header-user"></div>
                <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <!-- PERFIL -->
    <section class="perfil">
        <div class="foto-perfil" id="avatar"></div>
        <h2 id="username">Cargando...</h2>
        <p class="nombre" id="email"></p>
        <p class="nombre" id="post-count"></p>
    </section>

    <!-- GALERÍA -->
    <section class="galeria" id="galeria"></section>

<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user) {
        window.location.href = 'login.html';
    }

    // Header user
    const headerUser = document.getElementById('header-user');
    headerUser.innerHTML = `
        <a href="perfil.html" class="avatar-btn" title="${user.username}">
            ${user.username.charAt(0).toUpperCase()}
        </a>
    `;

    document.getElementById('username').textContent = '@' + user.username;
    document.getElementById('email').textContent = user.email;
    document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();

    async function cargarMisPosts() {
        const galeria = document.getElementById('galeria');

        try {
            const res = await fetch('https://social-network-production-8a9a.up.railway.app/api/posts');
            const posts = await res.json();

            const misPosts = posts.filter(p => p.author_id === user.id);

            document.getElementById('post-count').textContent = misPosts.length + ' posts';

            if (misPosts.length === 0) {
                galeria.innerHTML = '<p style="color:#cbd5f5; text-align:center; padding:20px;">Aún no tienes publicaciones.</p>';
                return;
            }

            galeria.innerHTML = misPosts.map(post => `
                <div class="post-card" onclick="window.location.href='post-detalle.html?id=${post._id}'">
                    ${post.media_url
                        ? `<div class="img"><img src="${post.media_url}" alt="media"></div>`
                        : post.tags && post.tags.length > 0
                            ? `<div class="img tag-img">
                                ${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                               </div>`
                            : `<div class="img"></div>`
                    }
                    <div class="post-body">
                        <p class="post-content">${post.content}</p>
                        <div class="post-footer">
                            <span class="like-count">❤️ ${post.likes_count} likes</span>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (err) {
            galeria.innerHTML = '<p style="color:#f87171;">Error al cargar tus posts.</p>';
        }
    }

    function buscar() {
        const texto = document.getElementById('busqueda').value.trim();
        if (texto) {
            window.location.href = `posts.html?q=${encodeURIComponent(texto)}`;
        }
    }

    document.getElementById('busqueda').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscar();
    });

    function cerrarSesion() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    cargarMisPosts();
</script>

</body>
</html>
