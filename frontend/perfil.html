<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <!-- HEADER -->
<header class="header">
    <div class="top-bar">
        <input type="text" placeholder="Buscar algo..." class="search">
        <a href="index.html" class="perfil-btn">Explorar</a>
        <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</header>

    <!-- PERFIL -->
    <section class="perfil">
        <div class="foto-perfil" id="avatar"></div>
        <h2 id="username">Cargando...</h2>
        <p class="nombre" id="email"></p>
        <p class="nombre" id="post-count"></p>
    </section>

    <!-- GALERÍA -->
    <section class="galeria" id="galeria"></section>

<script>

    function cerrarSesion() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user) {
        window.location.href = 'login.html';
    }

    document.getElementById('username').textContent = '@' + user.username;
    document.getElementById('email').textContent = user.email;

    async function cargarMisPosts() {
        const misPosts = posts.filter(p => p.author_id === user.id);
document.getElementById('post-count').textContent = misPosts.length + ' posts';
        const galeria = document.getElementById('galeria');

        try {
            const res = await fetch('https://social-network-production-8a9a.up.railway.app/api/posts');
            const posts = await res.json();

            const misPosts = posts.filter(p => p.author_id === user.id);

            if (misPosts.length === 0) {
                galeria.innerHTML = '<p style="color:#cbd5f5;">Aún no tienes publicaciones.</p>';
                return;
            }

            galeria.innerHTML = misPosts.map(post => `
                <div class="post" title="${post.content}">
                    ${post.media_url
                        ? `<img src="${post.media_url}" alt="media" style="width:100%; height:100%; object-fit:cover; border-radius:10px;">`
                        : ''
                    }
                </div>
            `).join('');

        } catch (err) {
            galeria.innerHTML = '<p style="color:#f87171;">Error al cargar tus posts.</p>';
        }
    }

    cargarMisPosts();
</script>

</body>
</html>
